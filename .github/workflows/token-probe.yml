name: token probe

on:
  workflow_dispatch:

jobs:
  write:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: exact command, write token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" --json isDraft,title,assets,body
          echo "write exit=$?"

  read:
    runs-on: ubuntu-latest
    steps:
      - name: exact command, default (read) token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" --json isDraft,title,assets,body
          echo "read exit=$?"
          gh release view v0.1.1 --repo "$GITHUB_REPOSITORY" --json isDraft
          echo "isDraft exit=$?"
