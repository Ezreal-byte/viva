name: text input

on:
  push:
    paths:
      - 'app/**'
      - 'internal/platform/**'
      - '.github/workflows/text-input.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'internal/platform/**'
      - '.github/workflows/text-input.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Application input lifecycle
        run: go test ./app -count=1
      - name: Windows IME lifecycle
        if: runner.os == 'Windows'
        run: go test ./internal/platform/windows -run 'TestComposition|TestDynamicTextInput' -count=1
      - name: Native static checks
        run: go vet ./app/... ./internal/platform/...
